name: Build NIGHTWATCH TV APK
on:
  push:
    branches: [ main ]
    paths:
      - 'NIGHTWATCH-TV-starter-updated.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack project archive
        run: |
          unzip -q NIGHTWATCH-TV-starter-updated.zip -d unpacked
          ROOT="$(find unpacked -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found in archive"
            find unpacked -maxdepth 4 -type f | head -100
            exit 1
          fi
          cp -a "$ROOT"/. .
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found on runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTWATCH-TV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public APK download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0
          name: NIGHTWATCH TV v0.1.0
          body: |
            NIGHTWATCH TV initial Android debug build.
            This is a test build; verify on your Android TV/Fire TV device before relying on it.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
